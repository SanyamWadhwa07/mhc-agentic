[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mhc-agentic"
version = "4.0.0"
description = "Mental Health Companion — Hinglish-aware agentic chatbot"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-groq>=0.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "tenacity>=8.3",
    "circuitbreaker>=1.4",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "redis[asyncio]>=5.0",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "streamlit>=1.36",
    "textblob>=0.18",
    "numpy>=1.26",
    "groq>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
